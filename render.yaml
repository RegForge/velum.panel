services:
  - type: web
    name: velum-panel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PLISIO_API_KEY
        sync: false
      - key: PANEL_ADMIN_USER
        value: admin
      - key: PANEL_ADMIN_TOKEN
        sync: false
